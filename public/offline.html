<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Offline — SkFlip</title>
<meta name="theme-color" content="#080810"/>
<link rel="icon" href="/icon.svg" type="image/svg+xml"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#080810;color:#f0f0f8;font-family:'DM Sans',system-ui,sans-serif;
  min-height:100dvh;display:flex;align-items:center;justify-content:center;
  padding:24px;text-align:center;line-height:1.6;
}
.wrap{max-width:380px}
.logo{
  font-family:'Bebas Neue',Impact,sans-serif;font-size:2.6rem;
  letter-spacing:2px;margin-bottom:28px;
}
.logo span{color:#e0a830}
.icon{
  width:66px;height:66px;margin:0 auto 22px;border-radius:50%;
  background:rgba(224,168,48,.1);border:1px solid rgba(224,168,48,.24);
  display:flex;align-items:center;justify-content:center;color:#e0a830;
}
h1{font-size:1.3rem;font-weight:600;margin-bottom:10px}
p{color:#8888aa;font-size:.94rem;margin-bottom:26px}
button{
  background:#e0a830;color:#0b0b14;border:none;border-radius:10px;
  padding:12px 30px;font-family:inherit;font-size:.94rem;font-weight:600;
  cursor:pointer;transition:background .18s ease;
}
button:hover{background:#f5c842}
button:focus-visible{outline:2px solid #f5c842;outline-offset:3px}
.note{margin-top:22px;font-size:.82rem;color:#6a6a88}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">SK<span>FLIP</span></div>
    <div class="icon" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <path d="M1 1l22 22"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.58 9"/>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
        <line x1="12" y1="20" x2="12.01" y2="20"/>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>Titles you've already opened are still available. Reconnect to browse the full catalogue.</p>
    <button onclick="location.reload()">Try again</button>
    <div class="note">SkFlip reconnects on its own once you're back online.</div>
  </div>

<script>
  // Reload the moment connectivity returns, so nobody sits on this page.
  window.addEventListener('online', () => location.replace('/'));
</script>
</body>
</html>
